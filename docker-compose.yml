# docker-compose.yml - WARP Proxy Stack para Dokploy
# 4 instâncias WARP SOCKS5 em portas 1081-1084 (0.0.0.0)
# Rede: dokploy-network (externo, gerenciado pelo Dokploy)

services:
  warp-proxy-1:
    image: caomingjun/warp:latest
    container_name: warp-proxy-1
    ports:
      - "0.0.0.0:1081:1080"
    privileged: true
    environment:
      - WARP_SLEEP=5
      - TZ=America/Sao_Paulo
      - WARP_ACCEPT_TOS=true
      - WARP_LICENSE_KEY=2p13EV5S-L3s5H2C6-29wOpG31
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - warp-data-1:/var/lib/cloudflare-warp
    networks:
      - dokploy-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  warp-proxy-2:
