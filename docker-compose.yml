services:
  warp-proxy-1:
    image: caomingjun/warp:latest
    container_name: warp-proxy-1
    ports:
      - "127.0.0.1:1081:1080"
    privileged: true
    environment:
      - WARP_SLEEP=5
      - TZ=America/Sao_Paulo
      - WARP_ACCEPT_TOS=true
      - WARP_LICENSE_KEY=2p13EV5S-L3s5H2C6-29wOpG31
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - warp-data-1:/var/lib/cloudflare-warp
    networks:
      dokploy-network:
        aliases:
          - warp-proxy
          - warp-proxy-1
    healthcheck:
      test:
        - CMD
        - curl
        - -x
        - socks5h://127.0.0.1:1080
        - -s
        - http://ifconfig.me
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
